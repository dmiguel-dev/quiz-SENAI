<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Quiz | Áreas de Atuação em TI | Mundo SENAI 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b:#17428F;--o:#F26B21;--fg:#0A1F44;--ac:#E5560F;--pn:rgba(23,66,143,.08);--u:min(1vw,1.78vh);--fh:clamp(56px,9vh,84px)}
@media(max-aspect-ratio:1/1){:root{--u:min(2.7vw,16px);--fh:clamp(60px,9vh,80px)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#fff;font-family:Sora,'Segoe UI',Arial,sans-serif;color:var(--fg);touch-action:manipulation}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--o);outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#pg{position:fixed;top:0;left:0;height:max(.7vh,4px);background:var(--o);z-index:9;transition:width .4s;width:0}
.s{position:absolute;inset:0;display:none;padding:max(3vh,16px) max(6vw,20px) calc(var(--fh) + 16px);z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.s.on{display:block;animation:fu .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(7vh) scale(.97);filter:blur(10px)}}
@keyframes rv{from{opacity:0;transform:translateY(3vh);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.r{animation:rv .8s cubic-bezier(.2,.8,.2,1) calc(.25s + var(--k,0)*.12s) backwards}
h1,h2{font-weight:800;letter-spacing:-.02em;line-height:1.05}
.qb{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:max(2.2vh,12px);max-width:min(1100px,100%);margin:0 auto}
.qb h2{font-size:max(22px,calc(3.4*var(--u)));color:var(--b)}
.ld{font-size:max(16px,calc(2*var(--u)));line-height:1.35;font-weight:600;border-left:.4vw solid var(--ac);border-left-width:max(4px,.4vw);padding-left:max(12px,1.2vw)}
.nt{font-size:max(14px,calc(1.55*var(--u)));line-height:1.4}
.bd{align-self:flex-start;background:var(--o);color:#fff;font-weight:800;font-size:max(13px,calc(1.4*var(--u)));padding:.8vh 1.2vw;padding:max(.8vh,6px) max(1.2vw,14px);border-radius:5vh}
.op4{display:grid;grid-template-columns:1fr 1fr;gap:max(1.5vw,10px)}
.op{display:flex;gap:max(1vw,10px);align-items:center;text-align:left;font:600 max(15px,calc(1.8*var(--u)))/1.25 Sora,Arial,sans-serif;padding:max(2vh,12px) max(1.2vw,14px);border:max(.25vw,3px) solid var(--b);border-radius:max(1vw,12px);background:#fff;color:var(--b);cursor:pointer;min-height:48px}
.op b{background:var(--b);color:#fff;border-radius:50%;min-width:max(3.4vw,32px);height:max(3.4vw,32px);display:grid;place-items:center;flex:none;font-size:max(14px,calc(1.6*var(--u)))}
.op:hover:not(:disabled){background:#E8F0FC}
.op.ok{background:#1E8E3E;border-color:#1E8E3E;color:#fff}.op.ok b{background:#fff;color:#1E8E3E}
.op.no{background:#C62828;border-color:#C62828;color:#fff;animation:sk .4s}.op.no b{background:#fff;color:#C62828}
.op:disabled{cursor:default}
@keyframes sk{25%{transform:translateX(-.6vw)}75%{transform:translateX(.6vw)}}
.fb{font-size:max(15px,calc(1.7*var(--u)));min-height:3.2em;font-weight:600;line-height:1.35}
.btn{align-self:flex-start;border:0;background:var(--o);color:#fff;font:800 max(17px,calc(2*var(--u))) Sora,Arial,sans-serif;padding:max(2vh,14px) max(2.4vw,28px);border-radius:5vh;cursor:pointer;animation:pl 1.6s infinite;min-height:48px}
.btn[hidden]{display:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(242,107,33,.65)}100%{box-shadow:0 0 0 max(2.4vw,16px) rgba(242,107,33,0)}}
.sc{font-size:max(64px,calc(9*var(--u)));font-weight:800;color:var(--o);line-height:1}
/* tela inicial */
.in{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:max(4vw,24px);align-items:center;min-height:100%;max-width:min(1200px,100%);margin:0 auto}
.in .lgo{display:block;width:92%;height:auto;max-width:480px;max-height:46vh;max-height:46dvh;object-fit:contain;object-position:center;justify-self:center;grid-column:2;grid-row:1}
.in h1{font-size:max(44px,calc(6.2*var(--u)));line-height:.95;color:var(--b);transform:skewX(-8deg);letter-spacing:-.03em;margin-bottom:max(1.6vh,10px)}
.in h1 span{display:block}
.in h1 em{font-style:normal;background:var(--o);color:#fff;padding:0 .18em;display:inline-block;margin-left:.1em}
.in .tx{display:flex;flex-direction:column;gap:max(1.8vh,12px);align-items:flex-start;grid-column:1;grid-row:1}
.chips{display:flex;flex-wrap:wrap;gap:max(.8vw,8px)}
.chips span{background:var(--pn);border-left:max(4px,.4vw) solid var(--o);padding:max(.8vh,6px) max(1vw,12px);font-size:max(13px,calc(1.45*var(--u)));font-weight:600}
.ft{position:fixed;left:0;right:0;bottom:0;height:var(--fh);padding:0 max(3vw,16px);padding-left:max(3vw,16px,env(safe-area-inset-left));padding-right:max(3vw,16px,env(safe-area-inset-right));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;gap:max(2vw,10px);font-size:clamp(13px,calc(1.3*var(--u)),26px);font-weight:600;border-top:2px solid rgba(128,128,128,.4);z-index:8;color:#0A1F44;background:#fff;box-sizing:content-box}
.ft #ftt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ftc{font-variant-numeric:tabular-nums;white-space:nowrap;background:rgba(128,128,128,.22);border-radius:5vh;padding:.4vh 1.2vw;padding:max(.4vh,3px) max(1.2vw,10px)}#ftc:empty{display:none}
.lg{background:#fff;border-radius:.8vh;padding:.5vh 1vw;display:flex;flex:none}.lg img{height:max(5.2vh,26px);max-height:calc(var(--fh) - 14px)}
/* retrato (celular / tablet em pé) */
@media(max-aspect-ratio:1/1){
.s{padding-top:max(2.5vh,16px)}
.qb,.in{max-width:760px}
.in{grid-template-columns:1fr;gap:max(2vh,14px);align-content:center;justify-items:center;text-align:left}.in .tx{grid-column:1;grid-row:1}.in .lgo{grid-column:1;grid-row:2}
.in .lgo{max-height:min(20vh,165px);width:auto;max-width:80%}
.in .tx{gap:max(1.2vh,8px)}.in h1{margin-bottom:0}
.chips span{padding:5px 10px}
.in .tx{width:100%}
.in h1{font-size:max(42px,calc(7.4*var(--u)))}
.op4{grid-template-columns:1fr;gap:max(1.2vh,8px)}
.op{padding:max(1.4vh,11px) 12px}
.qb .btn,.in .btn{width:100%;align-self:stretch}
.qb h2{font-size:max(22px,calc(2.7*var(--u)))}
.ld{font-size:max(16px,calc(1.7*var(--u)))}
}
/* telas muito estreitas */
@media(max-width:360px){.ft #ftt{display:none}.ft{justify-content:space-between}}
/* celular deitado / telas baixas */
@media(max-height:520px) and (min-aspect-ratio:101/100){
.s{padding-top:12px;padding-bottom:calc(var(--fh) + 10px)}
.qb{gap:10px}.qb h2{font-size:20px}
.op{padding:8px 12px;min-height:44px;font-size:14px}.op b{min-width:28px;height:28px}
.fb{min-height:2.6em;font-size:14px}
.in{gap:16px}.in .lgo{max-height:23vh}.in h1{font-size:40px;margin-bottom:4px}
.in .tx{gap:8px}.ld{font-size:15px}
.btn{padding:10px 24px;min-height:44px;font-size:16px}
.sc{font-size:56px}
}
/* telas grandes (projetor/desktop) */
@media(min-width:1600px){.qb{max-width:1300px}.in{max-width:1400px}}
@media(prefers-reduced-motion:reduce){.s.on,.btn,.op.no,.r{animation:none}}
</style></head><body>

{a:'Nuvem',q:'Para que serve a computação em nuvem?',o:['Alugar computadores pela internet','Imprimir documentos','Trocar o celular','Cozinhar mais rápido'],c:0,x:'A empresa aluga o que precisa, sem comprar servidores.'},
{a:'Segurança',q:'A cibersegurança serve para…',o:['Criar jogos','Vender computadores','Proteger dados contra invasões','Editar fotos'],c:2,x:'Ela é o escudo que protege dados e sistemas.'},
{a:'Dados e IA',q:'Na apresentação, os dados brutos foram comparados a…',o:['Ouro polido','Petróleo sem refino','Água filtrada','Energia solar'],c:1,x:'Precisam ser limpos e organizados para valerem mais.'},
{a:'QA',q:'O profissional de QA testa o aplicativo para…',o:['Desenhar logotipos','Instalar cabos de rede','Achar falhas antes dos clientes','Vender produtos'],c:2,x:'O QA encontra os erros antes que os clientes os encontrem.'},
{a:'Gestão',q:'A gestão em TI serve para…',o:['Organizar a equipe para entregar no prazo','Consertar computadores','Desenhar telas','Instalar cabos'],c:0,x:'A gestão organiza a equipe para entregar sem confusão.'},
{a:'UX/UI',q:'Na comparação com uma casa, o UX é…',o:['A cor da tinta','O jardim','O telhado','A planta baixa, o projeto da casa'],c:3,x:'UX é a planta da casa; UI é o acabamento visual.'},
{a:'Arquitetura',q:'O arquiteto de TI planeja o sistema…',o:['Depois de pronto','Só quando dá erro','Antes de construir','Nunca planeja'],c:2,x:'O arquiteto planeja tudo antes da construção.'}];
const N=Q.length,app=document.getElementById('app'),pg=document.getElementById('pg'),ftt=document.getElementById('ftt'),ftc=document.getElementById('ftc');
document.getElementById('ftl').src=LOGO_SESI_SENAI;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=-1,score=0;
const show=(html,title,count,pct)=>{app.innerHTML='<section class="s on">'+html+'</section>';app.firstChild.scrollTop=0;ftt.textContent=title;ftc.textContent=count;pg.style.width=pct+'%'};
function intro(){cur=-1;score=0;
 show(`<div class="in"><div class="tx"><h1 class="r" style="--k:0"><span>Quiz</span><span>da <em>TI</em></span></h1>
 <p class="ld r" style="--k:1">Teste o que você aprendeu sobre as áreas de atuação em TI.</p>
 <div class="chips r" style="--k:2"><span>${N} perguntas</span><span>Múltipla escolha</span><span>~2 min</span></div>
 <p class="nt r" style="--k:3">Errou? Tente de novo. Acertar de primeira vale ponto!</p>
 <button class="btn r" style="--k:4" id="go">Começar o quiz</button></div>
 <img class="lgo r" style="--k:1" src="${LOGO_SESI_SENAI}" alt="Logo SESI acima do SENAI"></div>`,'Mundo SENAI 2026','',0);
 document.getElementById('go').onclick=()=>ask(0)}
function ask(i){cur=i;const q=Q[i];let tries=0,done=false;
 show(`<div class="qb"><span class="bd">Pergunta ${i+1} de ${N} · ${esc(q.a)}</span><h2>${esc(q.q)}</h2><div class="op4">${q.o.map((o,j)=>`<button class="op" data-j="${j}"><b>${'ABCD'[j]}</b>${esc(o)}</button>`).join('')}</div><p class="fb" aria-live="polite"></p><button class="btn" id="nx" hidden>${i==N-1?'Ver resultado':'Próxima'}</button></div>`,'Pergunta: '+q.a,(i+1)+' / '+N,i/N*100);
 const fb=app.querySelector('.fb'),nx=document.getElementById('nx');
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(done)return;
  if(+b.dataset.j===q.c){done=true;b.classList.add('ok');if(!tries)score++;fb.innerHTML='<b>Correto!</b> '+esc(q.x);app.querySelectorAll('.op').forEach(x=>x.disabled=true);nx.hidden=false;pg.style.width=(i+1)/N*100+'%';nx.scrollIntoView({block:'nearest',behavior:'smooth'})}
  else{tries++;b.classList.add('no');b.disabled=true;fb.textContent='Alternativa incorreta. Tente novamente.'}});
 nx.onclick=()=>i==N-1?end():ask(i+1)}
function end(){const m=score==N?'Perfeito! Você dominou as áreas de TI.':score>=N*.7?'Muito bem! Você entendeu bem as áreas de TI.':score>=N*.4?'Bom resultado! Você já conhece boa parte das áreas de TI.':'A TI é um mundo enorme, e você deu o primeiro passo!';
 show(`<div class="qb"><span class="bd">Resultado</span><div class="sc">${score}/${N}</div><h2>${m}</h2><p class="nt">Acertos de primeira. Venha ser aluno SENAI: infraestrutura técnica e aprendizado prático, alinhados às necessidades do mercado de trabalho.</p></div>`,'Resultado do quiz',N+' / '+N,100);}
intro();
// fundo de ondas (mesmo dos slides de pergunta)
(()=>{const cv=document.getElementById('bg'),c=cv.getContext('2d'),R=matchMedia('(prefers-reduced-motion:reduce)').matches;let w,h,u,t=0,l=performance.now();
const fit=()=>{const d=Math.min(devicePixelRatio||1,1.5);w=cv.width=Math.round(innerWidth*d);h=cv.height=Math.round(innerHeight*d);u=Math.max(.5,w/1280)};fit();addEventListener('resize',fit);
const rows=17;
(function f(n){const dt=Math.min((n-l)/1e3,.1);l=n;if(!R)t+=dt;const cols=Math.ceil(w/(14*u));c.clearRect(0,0,w,h);
for(let a=0;a<rows;a++){const q=a/(rows-1),y0=h*(.42+.55*q),A=(10+34*q)*u;c.beginPath();for(let j=0;j<=cols;j++){const x=j*w/cols,y=y0+Math.sin(j*.11+t*.45+a*.5)*A+Math.sin(j*.045-t*.25+a*.2)*A*.8;j?c.lineTo(x,y):c.moveTo(x,y)}c.strokeStyle=a==9?'rgba(242,107,33,.5)':`rgba(23,66,143,${.07+.2*q})`;c.lineWidth=(a==9?2.4:1.6)*u;c.stroke()}
requestAnimationFrame(f)})(l)})();
</script></body></html>
