<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz | Áreas de Atuação em TI | Mundo SENAI 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b:#17428F;--o:#F26B21;--bg:#fff;--fg:#0A1F44;--ac:#E5560F;--pn:rgba(23,66,143,.08);--u:min(1vw,1.78vh)}
@media(max-aspect-ratio:1/1){:root{--u:2.7vw}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#fff;font-family:Sora,'Segoe UI',Arial,sans-serif;color:var(--fg)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#pg{position:fixed;top:0;left:0;height:.7vh;min-height:4px;background:var(--o);z-index:9;transition:width .4s;width:0}
.s{position:absolute;inset:0;display:none;padding:3vh 6vw max(12vh,76px);z-index:1;overflow:auto}
.s.on{display:block;animation:fu .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(7vh) scale(.97);filter:blur(10px)}}
h1,h2{font-weight:800;letter-spacing:-.02em;line-height:1.05}
.ld{font-size:calc(2*var(--u));line-height:1.35;margin:1.6vh 0;font-weight:600;border-left:.4vw solid var(--ac);padding-left:1.2vw}
.nt{font-size:calc(1.55*var(--u));line-height:1.35;margin-top:1.2vh}
.qb{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:2.5vh;max-width:120vh;margin:0 auto}
.qb h1{font-size:calc(6*var(--u));color:var(--b);transform:skewX(-8deg);line-height:.98}
.qb h2{font-size:calc(3.4*var(--u));color:var(--b)}
.bd{align-self:flex-start;background:var(--o);color:#fff;font-weight:800;font-size:calc(1.4*var(--u));padding:.8vh 1.2vw;border-radius:5vh}
.op4{display:grid;grid-template-columns:1fr 1fr;gap:1.5vw}
.op{display:flex;gap:1vw;align-items:center;text-align:left;font:600 calc(1.8*var(--u))/1.25 Sora,Arial,sans-serif;padding:2vh 1.2vw;border:.25vw solid var(--b);border-radius:1vw;background:#fff;color:var(--b);cursor:pointer}
.op b{background:var(--b);color:#fff;border-radius:50%;min-width:3.4vw;height:3.4vw;display:grid;place-items:center}
.op:hover:not(:disabled){background:#E8F0FC}
.op.ok{background:#1E8E3E;border-color:#1E8E3E;color:#fff}.op.ok b{background:#fff;color:#1E8E3E}
.op.no{background:#C62828;border-color:#C62828;color:#fff;animation:sk .4s}.op.no b{background:#fff;color:#C62828}
.op:disabled{cursor:default}
@keyframes sk{25%{transform:translateX(-.6vw)}75%{transform:translateX(.6vw)}}
.fb{font-size:calc(1.7*var(--u));min-height:6vh;font-weight:600}
.btn{align-self:flex-start;border:0;background:var(--o);color:#fff;font:800 calc(2*var(--u)) Sora,Arial,sans-serif;padding:2vh 2.4vw;border-radius:5vh;cursor:pointer;animation:pl 1.6s infinite}
.btn[hidden]{display:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(242,107,33,.65)}100%{box-shadow:0 0 0 2.4vw rgba(242,107,33,0)}}
.sc{font-size:calc(9*var(--u));font-weight:800;color:var(--o);line-height:1}
.ft{position:fixed;left:0;right:0;bottom:0;height:max(9vh,56px);padding:0 calc(2vw + env(safe-area-inset-left));display:flex;align-items:center;gap:2vw;font-size:clamp(14px,calc(1.3*var(--u)),30px);font-weight:600;border-top:2px solid rgba(128,128,128,.4);z-index:8;color:#0A1F44;background:#fff}
.ft #ftt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ftc{font-variant-numeric:tabular-nums;white-space:nowrap;background:rgba(128,128,128,.22);border-radius:5vh;padding:.4vh 1.2vw}
.lg{background:#fff;border-radius:.8vh;padding:.5vh 1vw;display:flex}.lg img{height:max(5.2vh,28px)}
@media(max-aspect-ratio:1/1){
.s{padding:3vh 5vw max(15vh,104px)}
.op4{grid-template-columns:1fr;gap:1.4vh}
.op b{min-width:8vw;height:8vw;font-size:4vw}
.op{font-size:4vw;padding:1.6vh 3vw;gap:3vw;border-width:.6vw;border-radius:3vw}
.qb h2{font-size:7vw}.qb h1{font-size:11vw}.bd{font-size:3.4vw;padding:.8vh 3vw}
.fb{font-size:4vw}.ld{font-size:4.6vw;padding-left:3vw;border-left-width:1vw}.nt{font-size:3.8vw}
.btn{font-size:4.6vw;padding:1.8vh 6vw}.sc{font-size:22vw}
.ft{height:max(11vh,76px);padding:0 4vw;font-size:clamp(13px,3.3vw,22px)}
}
@media(prefers-reduced-motion:reduce){.s.on,.btn,.op.no{animation:none}}
</style></head><body>

const N=Q.length,app=document.getElementById('app'),pg=document.getElementById('pg'),ftt=document.getElementById('ftt'),ftc=document.getElementById('ftc');
document.getElementById('ftl').src=L;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=-1,score=0;
const show=(html,title,count,pct)=>{app.innerHTML='<section class="s on">'+html+'</section>';ftt.textContent=title;ftc.textContent=count;pg.style.width=pct+'%'};
function intro(){cur=-1;score=0;show(`<div class="qb"><h1>Quiz</h1><p class="ld">Teste o que você aprendeu sobre as áreas de atuação em TI.</p><p class="nt">${N} perguntas de múltipla escolha. Se errar, tente de novo; acertar de primeira vale ponto.</p><button class="btn" id="go">Começar</button></div>`,'Quiz | Mundo SENAI 2026','',0);document.getElementById('go').onclick=()=>ask(0)}
function ask(i){cur=i;const q=Q[i];let tries=0,done=false;
 show(`<div class="qb"><span class="bd">Pergunta ${i+1} de ${N} · ${esc(q.a)}</span><h2>${esc(q.q)}</h2><div class="op4">${q.o.map((o,j)=>`<button class="op" data-j="${j}"><b>${'ABCD'[j]}</b>${esc(o)}</button>`).join('')}</div><p class="fb" aria-live="polite"></p><button class="btn" id="nx" hidden>${i==N-1?'Ver resultado':'Próxima'}</button></div>`,'Pergunta: '+q.a,(i+1)+' / '+N,i/N*100);
 const fb=app.querySelector('.fb'),nx=document.getElementById('nx');
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(done)return;
  if(+b.dataset.j===q.c){done=true;b.classList.add('ok');if(!tries)score++;fb.innerHTML='<b>Correto!</b> '+esc(q.x);app.querySelectorAll('.op').forEach(x=>x.disabled=true);nx.hidden=false;pg.style.width=(i+1)/N*100+'%';nx.focus({preventScroll:false})}
  else{tries++;b.classList.add('no');b.disabled=true;fb.textContent='Alternativa incorreta. Tente novamente.'}});
 nx.onclick=()=>i==N-1?end():ask(i+1)}
function end(){const m=score==N?'Perfeito! Você dominou as áreas de TI.':score>=N*.7?'Muito bem! Você entendeu bem as áreas de TI.':score>=N*.4?'Bom começo! Que tal rever a apresentação e tentar de novo?':'Vale rever a apresentação e tentar novamente!';
 show(`<div class="qb"><span class="bd">Resultado</span><div class="sc">${score}/${N}</div><h2>${m}</h2><p class="nt">Acertos de primeira. Venha ser aluno SENAI: infraestrutura técnica e aprendizado prático, alinhados às necessidades do mercado de trabalho.</p><button class="btn" id="rs">Jogar de novo</button></div>`,'Resultado do quiz',N+' / '+N,100);document.getElementById('rs').onclick=intro}
intro();
// fundo de ondas (mesmo dos slides de pergunta)
(()=>{const cv=document.getElementById('bg'),c=cv.getContext('2d'),R=matchMedia('(prefers-reduced-motion:reduce)').matches;let w,h,u,t=0,l=performance.now();
const fit=()=>{const d=Math.min(devicePixelRatio||1,1.5);w=cv.width=Math.round(innerWidth*d);h=cv.height=Math.round(innerHeight*d);u=Math.max(.5,w/1280)};fit();addEventListener('resize',fit);
const rows=17;
(function f(n){const dt=Math.min((n-l)/1e3,.1);l=n;if(!R)t+=dt;const cols=Math.ceil(w/(14*u));c.clearRect(0,0,w,h);
for(let a=0;a<rows;a++){const q=a/(rows-1),y0=h*(.42+.55*q),A=(10+34*q)*u;c.beginPath();for(let j=0;j<=cols;j++){const x=j*w/cols,y=y0+Math.sin(j*.11+t*.45+a*.5)*A+Math.sin(j*.045-t*.25+a*.2)*A*.8;j?c.lineTo(x,y):c.moveTo(x,y)}c.strokeStyle=a==9?'rgba(242,107,33,.5)':`rgba(23,66,143,${.07+.2*q})`;c.lineWidth=(a==9?2.4:1.6)*u;c.stroke()}
requestAnimationFrame(f)})(l)})();
</script></body></html>
